<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #071527; }
      .foyer { fill: #2b82ea; stroke: #1e62c1; stroke-width: 2; }
      .foyer-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; text-anchor: middle; dom-dominant-baseline: middle; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 28px; text-anchor: middle; }
      .note-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; text-anchor: end; }
      .room-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .room-text-sm { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
      .stairs { fill: none; stroke: #60a5fa; stroke-width: 1.5; stroke-dasharray: 2,2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" class="bg" />

  <!-- Stairs/Lines around Foyer -->
  <line x1="395" y1="150" x2="395" y2="210" class="stairs" />
  <line x1="400" y1="150" x2="400" y2="210" class="stairs" />
  <line x1="405" y1="150" x2="405" y2="210" class="stairs" />
  
  <line x1="585" y1="150" x2="585" y2="210" class="stairs" />
  <line x1="590" y1="150" x2="590" y2="210" class="stairs" />
  <line x1="595" y1="150" x2="595" y2="210" class="stairs" />

  <!-- Central Foyer Polygon -->
  <path d="M 420 120 L 480 80 L 520 80 L 570 120 L 570 245 L 420 245 Z" class="foyer" />
  <text x="495" y="175" class="foyer-text">Foyer</text>

  <!-- Top Rotated Left Room -->
  <g transform="translate(390, 80) rotate(-15)">
    <rect width="70" height="50" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <text x="35" y="25" class="room-text">101</text>
  </g>

  <!-- Top Rotated Right Room -->
  <g transform="translate(465, 55) rotate(15)">
    <rect width="70" height="50" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="35" y="25" class="room-text">102</text>
  </g>

  <rect x="296" y="150" width="60" height="50" rx="2" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="326" y="175" class="room-text">105</text>
  <rect x="232" y="150" width="60" height="50" rx="2" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="262" y="175" class="room-text">104</text>
  <rect x="168" y="150" width="60" height="50" rx="2" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="198" y="175" class="room-text">103</text>
  <rect x="123" y="150" width="40" height="50" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
  <text x="143" y="175" class="room-text-sm">Elev</text>
  <rect x="50" y="210" width="110" height="100" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="105" y="252" class="room-text">Staff</text>
  <text x="105" y="270" class="room-text">Room</text>
  <rect x="595" y="150" width="60" height="50" rx="2" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="625" y="175" class="room-text">106</text>
  <rect x="659" y="150" width="60" height="50" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
  <text x="689" y="175" class="room-text">107</text>
  <rect x="723" y="150" width="60" height="50" rx="2" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <text x="753" y="175" class="room-text">108</text>
  <rect x="787" y="150" width="60" height="50" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
  <text x="817" y="175" class="room-text">109</text>
  <rect x="860" y="210" width="110" height="110" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
  <text x="915" y="257" class="room-text">Exam</text>
  <text x="915" y="275" class="room-text">Cell</text><text x="960" y="380" class="note-text">IGNOU Study Centre →</text><text x="500" y="375" class="title-text">First Floor</text>
</svg>